# Render Blueprint — creates the database and the API in one go.
# Render dashboard → New → Blueprint → pick this repo.
# This is a STAGING setup (fake payments, free plan). See README "Deploy on Render".
databases:
  - name: meko-db
    databaseName: meko
    user: meko
    plan: free
    region: frankfurt

services:
  - type: web
    name: meko-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    # runs migrations + seed (the seed skips itself if the catalog exists), then the API
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: meko-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_URL_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: CUSTOMER_TOKEN_TTL
        value: 24h
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      # The frontend(s) allowed to call the API (comma-separated). Add the deployed frontend URL later.
      - key: FRONTEND_ORIGIN
        value: http://localhost:3001
      - key: FRONTEND_PAYMENT_RETURN_URL
        value: http://localhost:3001/order/payment-result
      - key: SEED_WHATSAPP_NUMBER
        sync: false
